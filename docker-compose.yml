version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: serverless_events_dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: serverless_events_dynamodb_admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local

  mysql:
    image: mysql:8.0
    container_name: serverless_events_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: events_portal
      MYSQL_USER: events_user
      MYSQL_PASSWORD: events_password
    volumes:
      - mysql_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: serverless_events_mailpit
    ports:
      - "1025:1025" # SMTP server for reminder worker
      - "8025:8025" # Webmail UI for viewing sent notification emails
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  dynamodb_data:
  mysql_data:
