version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    groups:
      aws:
        patterns: ["github.com/aws/*"]
  - package-ecosystem: composer
    directory: /portal
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /portal
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/backend, /portal]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
