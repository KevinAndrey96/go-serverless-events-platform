service: event-users-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: provided.al2
  region: us-east-1
  memorySize: 128
  environment:
    EVENTS_TABLE_NAME: ${env:EVENTS_TABLE_NAME, 'events-testing-table'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
      Resource: "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/events-testing-table/index/eventid-index"

package:
  individually: true

functions:
  v1:
    handler: bin/v1
    package:
      patterns:
        - './bin/v1'
    events:
      - http:
          path: /v1
          method: GET
          cors: true
          request:
            parameters:
              querystrings:
                param: false
                eventid: false
